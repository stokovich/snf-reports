# Every hour: the report from FIO, encrypted with the site password, published to GitHub Pages.
# The log of a public repo is public - the scripts print counts only, never data.
name: Build reports

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'fio_report.py', 'sheet_members.py', 'tools/encrypt.py', '.github/workflows/build.yml']

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs, as GitHub's own Pages workflow: the deploy step looks for the uploaded site only after the build
# job has finished - in one job it sometimes looked too early ("No artifacts named github-pages").
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # GitHub pauses the schedule of a repo with no activity for 60 days; enabling the workflow from the
      # workflow itself every run keeps it counted as active
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build.yml/enable" --silent || echo "keep-alive: not possible this run"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet cryptography
      - name: Report from FIO
        env:
          FIO_KEY: ${{ secrets.FIO_KEY }}
          CORP_SHEET_ID: ${{ secrets.CORP_SHEET_ID }}
          SHEET_MEMBERS: ${{ secrets.SHEET_MEMBERS }}
        run: python fio_report.py "$RUNNER_TEMP/data.json"
      - name: Encrypt
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          mkdir -p _site
          cp site/index.html _site/
          python tools/encrypt.py "$RUNNER_TEMP/data.json" _site/data.enc
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
